# This file defines the sensors that are connected to the robot.
cameras:
    rgbd: 
        name: realsense_d435i
        quantity: 1
        pan: 0
        tilt: 0
        tf_frames: 
            - mock_pruner__camera0 # TODO: make these dynamic with eef_prefix
            
    tof:
        name: vl6180
        quantity: 2 # TODO: delete, iterate only over frames
        pan: 0 # for now, we assume that the TOF sensors are mounted on the same plane as defined by the URDF. Change if needed.
        tilt: 0
        tf_frames: 
            - mock_pruner__tof0
            - mock_pruner__tof1
        
    
    
    