[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "final_approach_controller"
version = "0.0.1"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Luke Strohbehn", email = "luke.strohbehn@gmail.com" },
]
maintainers = [
    { name = "Luke Strohbehn", email = "luke.strohbehn@gmail.com" },
]
description = "A package for running the final approach controller using the pybullet-tree-sim package."
requires-python = ">=3.8"
dependencies = [
    # "pybullet_tree_sim @ git+ssh://git@github.com/OSURobotics/pybullet-tree-sim.git@develop",
    "pybullet_tree_sim @ file:///home/luke/dev/pybullet/pybullet-tree-sim/"
]
